<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E7F">
<title>Sem internet · Balcão Moda</title>
<style>
  :root{color-scheme:light dark;--f:#F4F8F7;--t:#112021;--p:#0B6E7F}
  @media (prefers-color-scheme:dark){:root{--f:#0B1414;--t:#E6F0EF;--p:#4CB7C8}}
  body{margin:0;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left));background:var(--f);color:var(--t);font:16px/1.5 system-ui,sans-serif;max-width:420px;margin-inline:auto}
  h1{margin:0;color:var(--p);font-size:26px}
  button{min-height:48px;border:0;border-radius:12px;background:var(--p);color:var(--f);font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<h1>Sem internet</h1>
<p>O Balcão Moda precisa de internet para mostrar e gravar as vendas, o estoque e o caixa. Nada que você fez foi perdido. Confira a conexão e tente de novo.</p>
<button type="button" onclick="location.reload()">Tentar de novo</button>
</body>
</html>
